<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090d1c"><title>MAZE RACE | 迷宮競速</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#18224d,#080b17 70%);color:#eef4ff;font-family:system-ui,'Noto Sans TC',sans-serif;min-height:100vh;text-align:center}main{max-width:690px;margin:auto;padding:20px 15px 40px}h1{font-size:clamp(32px,9vw,56px);margin:16px 0 4px;color:#66faff;text-shadow:0 0 24px #00b5ff}h2{margin:10px 0}p{color:#a8b5d5}.panel{background:#101a32db;border:1px solid #35578b;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 0 30px #00bbff15}button,input{font:inherit;border-radius:12px;padding:12px 18px}button{background:linear-gradient(110deg,#00e5ff,#8964ff);border:0;color:#061326;font-weight:800;cursor:pointer;margin:5px;touch-action:manipulation}button:disabled{opacity:.4}input{background:#0b1327;color:white;border:1px solid #42638c;width:min(100%,300px);margin:5px}#maze{display:block;width:min(94vw,525px);height:auto;aspect-ratio:1;margin:10px auto;background:#070d1c;border:2px solid #3ce7ff;border-radius:8px;box-shadow:0 0 28px #00cfff45}.hidden{display:none!important}.code{font-size:40px;letter-spacing:7px;color:#7afcff;font-weight:900}.pad{display:grid;grid-template-columns:repeat(3,65px);justify-content:center;gap:6px;margin:10px auto}.pad button{height:56px;margin:0;font-size:24px;padding:0}.pad .blank{visibility:hidden}ol{text-align:left;max-width:400px;margin:10px auto}li{padding:7px;border-bottom:1px solid #294266}.tag{color:#76faff}.small{font-size:13px}.qr{background:white;padding:10px;border-radius:12px;width:210px;max-width:80%}#message{color:#ffc978;min-height:20px}#timer{font-size:30px;font-weight:900;color:#8afcff}</style></head><body><main><h1>⚡ MAZE RACE</h1><p>50 人同步競速 · 霓虹迷宮 · 最快破關獲勝</p><div id="message"></div><section id="home" class="panel"><h2>準備開戰</h2><button id="create">我是主持人 · 建立房間</button><hr style="border-color:#294266"><input id="code" placeholder="輸入 6 位房間碼" maxlength="6"><input id="name" placeholder="你的暱稱（最多 16 字）" maxlength="16"><button id="join">加入競賽</button></section><section id="lobby" class="panel hidden"><h2 id="role"></h2><div id="roomcode" class="code"></div><div id="hosttools" class="hidden"><p>請大家掃描 QR Code 加入</p><img id="qr" class="qr" alt="房間 QR Code"><p class="small">或分享房間網址：<a id="share" style="color:#76faff">加入連結</a></p><button id="start">開始比賽（3 秒倒數）</button><button id="reset">下一場</button></div><p id="waiting">等待主持人開始…</p><h3>參賽者 <span id="count"></span>/50</h3><div id="names"></div></section><section id="game" class="panel hidden"><h2 id="phase">準備</h2><div id="timer">00:00.000</div><canvas id="maze" width="630" height="630"></canvas><div id="pad" class="pad"><span class="blank"></span><button data-d="0,-1">▲</button><span class="blank"></span><button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button></div><p class="small">也可使用鍵盤方向鍵 / WASD</p></section><section id="scores" class="panel hidden"><h2>🏆 即時排行榜</h2><ol id="ranking"></ol></section></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
